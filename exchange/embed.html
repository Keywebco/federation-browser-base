<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextXus Exchange — Message Board</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #000;
  color: #00FF88;
  font-family: 'Courier New', Courier, monospace;
  font-size: 16px;
  line-height: 1.5;
}

body {
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 10px;
}

h1 {
  font-size: 20px;
  text-align: center;
  letter-spacing: 2px;
  padding: 6px 0;
  border-bottom: 1px solid #00FF8844;
  flex-shrink: 0;
  color: #00FF88;
}

#status-bar {
  text-align: center;
  font-size: 13px;
  color: #00FF8899;
  flex-shrink: 0;
  min-height: 18px;
}

#messages {
  flex: 1 1 auto;
  overflow-y: auto;
  border: 1px solid #00FF8833;
  border-radius: 4px;
  padding: 8px;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-track { background: #111; }
#messages::-webkit-scrollbar-thumb { background: #00FF8855; border-radius: 3px; }

.msg {
  font-size: 18px;
  padding: 8px 10px;
  border-left: 3px solid #00FF8866;
  background: #0a0a0a;
  border-radius: 2px;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.msg-name {
  font-weight: bold;
  color: #00FFAA;
  font-size: 14px;
}

.msg-time {
  font-size: 11px;
  color: #00FF8866;
  margin-left: 8px;
}

.msg-text {
  margin-top: 3px;
  color: #00FF88;
  font-size: 18px;
  white-space: pre-wrap;
}

.empty-state {
  text-align: center;
  color: #00FF8888;
  font-size: 18px;
  padding: 30px 10px;
  font-style: italic;
}

.connecting-state {
  text-align: center;
  color: #00FF8888;
  font-size: 18px;
  padding: 30px 10px;
}

.connecting-state .dot-pulse::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

#compose {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-top: 1px solid #00FF8844;
  padding-top: 10px;
}

#compose label {
  font-size: 13px;
  color: #00FF8899;
}

#name-input, #msg-input, #send-btn {
  font-family: 'Courier New', Courier, monospace;
  font-size: 16px;
  border: 1px solid #00FF8844;
  border-radius: 4px;
  background: #0a0a0a;
  color: #00FF88;
  padding: 8px 10px;
  outline: none;
}

#name-input:focus, #msg-input:focus {
  border-color: #00FF88;
  box-shadow: 0 0 4px #00FF8844;
}

#msg-input {
  resize: vertical;
  min-height: 50px;
  max-height: 150px;
}

#char-counter {
  font-size: 12px;
  color: #00FF8866;
  text-align: right;
}

#char-counter.warn { color: #FFAA00; }
#char-counter.full { color: #FF4444; }

#send-btn {
  background: #00FF8822;
  color: #00FF88;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 1px;
  padding: 10px;
  transition: background 0.2s;
}

#send-btn:hover { background: #00FF8844; }
#send-btn:active { background: #00FF8866; }
#send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.row {
  display: flex;
  gap: 6px;
  align-items: stretch;
}

.row #name-input { flex: 1; }
.row #send-btn { flex: 0 0 auto; white-space: nowrap; }

@media (max-width: 400px) {
  body { padding: 8px; gap: 8px; }
  h1 { font-size: 17px; }
  .msg { font-size: 16px; padding: 6px 8px; }
  .msg-text { font-size: 16px; }
}
</style>
</head>
<body>

<h1 aria-label="NextXus Exchange Message Board">⬡ NEXUS EXCHANGE</h1>
<div id="status-bar" role="status" aria-live="polite"></div>
<div id="messages" role="log" aria-live="polite" aria-label="Messages"></div>

<form id="compose" autocomplete="off" aria-label="Post a message">
  <label for="name-input">Your name</label>
  <input type="text" id="name-input" placeholder="Anonymous" maxlength="80" aria-label="Your name" />
  <label for="msg-input">Message</label>
  <textarea id="msg-input" placeholder="Type your message..." maxlength="2000" rows="2" aria-label="Message text"></textarea>
  <div id="char-counter" aria-live="off">0 / 2000</div>
  <button type="submit" id="send-btn" aria-label="Send message">SEND ▸</button>
</form>

<script>
(function() {
  'use strict';

  var API = 'https://plexus-relay-api.onrender.com';
  var POLL_MS = 3000;
  var MAX_CHARS = 2000;

  var messagesEl = document.getElementById('messages');
  var statusBar = document.getElementById('status-bar');
  var nameInput = document.getElementById('name-input');
  var msgInput = document.getElementById('msg-input');
  var charCounter = document.getElementById('char-counter');
  var sendBtn = document.getElementById('send-btn');
  var composeForm = document.getElementById('compose');

  var lastMessageCount = -1;
  var connected = false;
  var firstLoad = true;

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function formatTime(ts) {
    try {
      var d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      var h = d.getHours(); var m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12; if (h === 0) h = 12;
      var ms = m < 10 ? '0' + m : '' + m;
      var mon = d.toLocaleString('en-US', {month:'short'});
      var day = d.getDate();
      return mon + ' ' + day + ', ' + h + ':' + ms + ' ' + ampm;
    } catch(e) { return ''; }
  }

  function renderMessages(msgs) {
    if (!msgs || msgs.length === 0) {
      messagesEl.innerHTML = '<div class="empty-state" role="status">No messages yet — say hello.</div>';
      lastMessageCount = 0;
      return;
    }

    var wasAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 30;
    var newCount = msgs.length;

    var html = '';
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      var name = m.name || 'Anonymous';
      var time = formatTime(m.timestamp);
      html += '<div class="msg" role="article">' +
        '<span class="msg-name">' + escapeHtml(name) + '</span>' +
        (time ? '<span class="msg-time">' + escapeHtml(time) + '</span>' : '') +
        '<div class="msg-text">' + escapeHtml(m.text || '') + '</div>' +
        '</div>';
    }
    messagesEl.innerHTML = html;

    if (firstLoad || (newCount > lastMessageCount) || wasAtBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    lastMessageCount = newCount;
    firstLoad = false;
  }

  function showConnecting() {
    messagesEl.innerHTML = '<div class="connecting-state" role="status">Connecting to the Nexus<span class="dot-pulse"></span></div>';
    statusBar.textContent = 'Waking up the relay — this may take a moment...';
  }

  function fetchMessages() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API + '/messages', true);
    xhr.timeout = 15000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (Array.isArray(data)) {
            connected = true;
            statusBar.textContent = '';
            renderMessages(data);
          }
        } catch(e) {
          if (!connected) {
            showConnecting();
          }
        }
      } else {
        if (!connected) showConnecting();
        else statusBar.textContent = 'Relay hiccup — retrying...';
      }
    };
    xhr.onerror = function() {
      if (!connected) showConnecting();
      else statusBar.textContent = 'Connection lost — retrying...';
    };
    xhr.ontimeout = function() {
      if (!connected) showConnecting();
      else statusBar.textContent = 'Relay slow — retrying...';
    };
    xhr.send();
  }

  function postMessage(name, text) {
    sendBtn.disabled = true;
    sendBtn.textContent = 'SENDING...';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', API + '/relay', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 15000;
    xhr.onload = function() {
      sendBtn.disabled = false;
      sendBtn.textContent = 'SEND ▸';
      if (xhr.status >= 200 && xhr.status < 300) {
        msgInput.value = '';
        updateCharCounter();
        msgInput.focus();
        fetchMessages();
      } else {
        statusBar.textContent = 'Send failed — try again.';
        setTimeout(function(){ statusBar.textContent = ''; }, 4000);
      }
    };
    xhr.onerror = function() {
      sendBtn.disabled = false;
      sendBtn.textContent = 'SEND ▸';
      statusBar.textContent = 'Network error — try again.';
      setTimeout(function(){ statusBar.textContent = ''; }, 4000);
    };
    xhr.ontimeout = function() {
      sendBtn.disabled = false;
      sendBtn.textContent = 'SEND ▸';
      statusBar.textContent = 'Timed out — relay may be waking up. Try again.';
      setTimeout(function(){ statusBar.textContent = ''; }, 5000);
    };
    xhr.send(JSON.stringify({ name: name, text: text }));
  }

  function updateCharCounter() {
    var len = msgInput.value.length;
    charCounter.textContent = len + ' / ' + MAX_CHARS;
    charCounter.className = '';
    if (len >= MAX_CHARS) charCounter.className = 'full';
    else if (len >= MAX_CHARS * 0.9) charCounter.className = 'warn';
  }

  msgInput.addEventListener('input', updateCharCounter);

  composeForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var text = msgInput.value.trim();
    if (!text) return;
    if (text.length > MAX_CHARS) {
      text = text.substring(0, MAX_CHARS);
    }
    var name = nameInput.value.trim() || 'Anonymous';
    postMessage(name, text);
  });

  showConnecting();
  fetchMessages();
  setInterval(fetchMessages, POLL_MS);

})();
</script>
</body>
</html>
